include:
  - 'https://gitlab-templates.ddbuild.io/slack-notifier/v1/template.yml'

# SETUP

variables:
  REPO: 'dd-sdk-roku'
  CI_IMAGE_VERSION: "5"
  CI_IMAGE: 'registry.ddbuild.io/ci/$REPO:$CI_IMAGE_VERSION'
  GIT_REPOSITORY: 'git@github.com:DataDog/dd-sdk-roku.git'
  MAIN_BRANCH: 'main'
  GIT_DEPTH: 5

  DD_AGENT_HOST: "$BUILDENV_HOST_IP"
  DD_SERVICE: "dd-sdk-roku"
  DD_ENV_TESTS: "ci"
  DD_INTEGRATION_JUNIT_5_ENABLED: "true"
  DD_CIVISIBILITY_ENABLED: "true"
  DD_INSIDE_CI: "true"

stages:
  - ci-image
  - security
  - analysis
  - test
  - publish
  - notify

.base-configuration:
  tags: ['arch:amd64']
  image: $CI_IMAGE

########################################################################################################################
# CI IMAGE
########################################################################################################################

ci-image:
  stage: ci-image
  when: manual
  except: [ tags, schedules ]
  tags: ['arch:amd64']
  image: "registry.ddbuild.io/images/docker:27.3.1"
  script:
    - echo $CI_IMAGE
    - docker buildx build
      --file Dockerfile.gitlab
      --platform linux/amd64
      --tag $CI_IMAGE
      --push
      .

########################################################################################################################
# STATIC ANALYSIS
########################################################################################################################

analysis:woke:
  extends:
    - .base-configuration
  stage: analysis
  timeout: 30m
  script:
    - /usr/bin/woke --exit-1-on-failure

analysis:check_copyright:
  extends:
    - .base-configuration
  stage: analysis
  timeout: 30m
  script:
    - tools/copyright/check_copyright.sh

analysis:lint:
  extends:
    - .base-configuration
  stage: analysis
  timeout: 30m
  script:
    - npm run lint

analysis:sca-test:
  extends:
    - .base-configuration
  stage: analysis
  timeout: 30m
  script:
    - export ROKU_SCA="/usr/bin/roku-sca/bin/sca-cmd"
    - npm run sca-test

analysis:sca-sample:
  extends:
    - .base-configuration
  stage: analysis
  timeout: 30m
  script:
    - export ROKU_SCA="/usr/bin/roku-sca/bin/sca-cmd"
    - npm run sca-sample

analysis:check-dist:
  extends:
    - .base-configuration
  stage: analysis
  timeout: 30m
  script:
    - npm run check-dist

########################################################################################################################
# TESTS
########################################################################################################################

test:roku:
# disabled for now as we need a device in CI to run the tests :/
  when: manual
  extends:
    - .base-configuration
  stage: test
  timeout: 1h
  script:
    - npm install
    - npm test

test:roca:
  extends:
    - .base-configuration
  stage: test
  timeout: 30m
  script:
    - npm install
    - npm run test:roca -- --forbid-focused

########################################################################################################################
# PUBLISH ARTIFACTS ON NPM
########################################################################################################################

# TODO
publish:release:
  extends:
    - .base-configuration
  only:
    - tags
  stage: publish
  timeout: 30m
  script:
    - echo "Publishing"

########################################################################################################################
# SLACK NOTIFICATIONS
########################################################################################################################

notify:publish-success:
  extends: .slack-notifier-base
  stage: notify
  when: on_success
  only:
    - tags
  script:
    - ROPM_URL="https://www.npmjs.com/package/@datadog/datadog-roku/v/$CI_COMMIT_TAG"
    - 'MESSAGE_TEXT=":package: :roku: $CI_PROJECT_NAME $CI_COMMIT_TAG published on :npm: $ROPM_URL"'
    - postmessage "#mobile-sdk-ops" "$MESSAGE_TEXT"

notify:publish-failure:
  extends: .slack-notifier-base
  stage: notify
  when: on_failure
  only:
    - tags
  script:
    - BUILD_URL="$CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID"
    - 'MESSAGE_TEXT=":test-fail: :roku: $CI_PROJECT_NAME $CI_COMMIT_TAG publish pipeline <$BUILD_URL|$COMMIT_MESSAGE> failed."'
    - postmessage "#mobile-sdk-ops" "$MESSAGE_TEXT"
